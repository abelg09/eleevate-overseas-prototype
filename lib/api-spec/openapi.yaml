              count:
                type: integer
            required: [status, count]
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required: [totalApplications, shortlistedUniversities, documentsUploaded, upcomingDeadlines, applicationsByStatus, recentActivity]

