components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    User:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [student, consultant, partner, admin]
        avatarUrl:
          type: string
        onboardingComplete:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, clerkId, email, role, onboardingComplete, createdAt]

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [data, total, page, limit]

    UpdateUserBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string

    AdminUpdateUserBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [student, consultant, partner, admin]
        avatarUrl:
          type: string

    OnboardingBody:
      type: object
      properties:
        role:
          type: string
          enum: [student, consultant, partner, admin]
        firstName:
          type: string
        lastName:
          type: string
        targetCountries:
          type: array
          items:
            type: string
        studyLevel:
          type: string
        agencyName:
          type: string
        specializations:
          type: array
          items:
            type: string
      required: [role, firstName, lastName]

    StudentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StudentProfile"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [data, total, page, limit]

    StudentProfile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        targetCountries:
          type: array
          items:
            type: string
        studyLevel:
          type: string
          enum: [undergraduate, postgraduate, phd, diploma, certificate]
        budget:
          type: number
        gpa:
          type: number
        ieltsScore:
          type: number
        toeflScore:
          type: number
        greScore:
          type: number
        gmatScore:
          type: number
        preferredIntake:
          type: string
        workExperience:
          type: integer
        nationality:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [id, userId]

    UpdateStudentProfileBody:
      type: object
      properties:
        targetCountries:
          type: array
          items:
            type: string
        studyLevel:
          type: string
        budget:
          type: number
        gpa:
          type: number
        ieltsScore:
          type: number
        toeflScore:
          type: number
        greScore:
          type: number
        gmatScore:
          type: number
        preferredIntake:
          type: string
        workExperience:
          type: integer
        nationality:
          type: string

    ConsultantProfile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        agencyName:
          type: string
        licenseNumber:
          type: string
        specializations:
          type: array
          items:
            type: string
        countriesServed:
          type: array
          items:
            type: string
        yearsExperience:
          type: integer
        bio:
          type: string
        rating:
          type: number
        totalClients:
          type: integer
        updatedAt:
          type: string
