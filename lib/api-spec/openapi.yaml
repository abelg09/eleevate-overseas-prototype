      type: object
      properties:
        agencyName:
          type: string
        licenseNumber:
          type: string
        specializations:
          type: array
          items:
            type: string
        countriesServed:
          type: array
          items:
            type: string
        yearsExperience:
          type: integer
        bio:
          type: string

