          type: integer
        logoUrl:
          type: string
        imageUrl:
          type: string
        website:
          type: string
        description:
          type: string
        acceptanceRate:
          type: number
        avgTuitionUsd:
          type: integer
        featured:
          type: boolean
        programCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, country, city, createdAt]

    UniversityListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/University"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [data, total, page, limit]

    Program:
      type: object
      properties:
        id:
          type: string
        universityId:
          type: string
        name:
          type: string
        degree:
          type: string
          enum: [bachelor, master, phd, diploma, certificate, mba]
        field:
          type: string
        duration:
          type: integer
        durationUnit:
          type: string
          enum: [months, years]
        tuitionUsd:
          type: integer
        applicationDeadline:
          type: string
          format: date
        startDate:
          type: string
          format: date
        ieltsRequirement:
          type: number
        toeflRequirement:
          type: number
        gpaRequirement:
          type: number
