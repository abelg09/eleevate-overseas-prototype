                $ref: "#/components/schemas/ConsultantPipelineSummary"

  /consultants:
    get:
      operationId: listConsultants
      tags: [consultants]
      summary: List consultants
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: country
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of consultants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantListResponse"

  /consultants/{id}:
    get:
      operationId: getConsultant
      tags: [consultants]
      summary: Get consultant by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Consultant profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantProfile"
    patch:
      operationId: updateConsultant
      tags: [consultants]
      summary: Update consultant by ID (admin or self)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsultantProfileBody"
      responses:
        "200":
          description: Updated consultant profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantProfile"
    delete:
      operationId: deleteConsultant
      tags: [consultants]
      summary: Delete consultant by ID (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Universities ───────────────────────────────────────────────────────────
  /universities:
    get:
      operationId: listUniversities
      tags: [universities]
      summary: List universities
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: country
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: minRanking
          in: query
          schema:
            type: integer
        - name: maxRanking
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Universities list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityListResponse"
    post:
      operationId: createUniversity
      tags: [universities]
      summary: Create university (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUniversityBody"
      responses:
        "201":
          description: Created university
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/University"

  /universities/featured:
    get:
      operationId: getFeaturedUniversities
      tags: [universities]
      summary: Get featured universities
      responses:
        "200":
          description: Featured universities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/University"

  /universities/{id}:
    get:
      operationId: getUniversity
      tags: [universities]
      summary: Get university by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: University
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/University"
    patch:
      operationId: updateUniversity
      tags: [universities]
      summary: Update university (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUniversityBody"
      responses:
        "200":
          description: Updated university
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/University"
    delete:
      operationId: deleteUniversity
      tags: [universities]
      summary: Delete university (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Programs ───────────────────────────────────────────────────────────────
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List programs
      parameters:
        - name: universityId
          in: query
          schema:
            type: string
        - name: degree
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Programs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramListResponse"
    post:
      operationId: createProgram
      tags: [programs]
      summary: Create program (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgramBody"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"

  /programs/{id}:
    get:
      operationId: getProgram
      tags: [programs]
      summary: Get program by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
    patch:
      operationId: updateProgram
      tags: [programs]
      summary: Update program (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramBody"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
    delete:
      operationId: deleteProgram
      tags: [programs]
      summary: Delete program (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Countries ──────────────────────────────────────────────────────────────
  /countries:
    get:
      operationId: listCountries
      tags: [countries]
      summary: List countries
      responses:
        "200":
          description: Countries list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
    post:
      operationId: createCountry
      tags: [countries]
      summary: Create country (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCountryBody"
      responses:
        "201":
          description: Created country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"

  /countries/{code}:
    get:
      operationId: getCountry
      tags: [countries]
      summary: Get country by code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
    patch:
      operationId: updateCountry
      tags: [countries]
      summary: Update country (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCountryBody"
      responses:
