<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eleevate — v4 concept (rich)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#161a19; --muted:#69716d; --faint:#9aa19c;
  --line:#eaece9; --line-2:#e0e3df;
  --green:#12925a; --green-d:#0d7548; --green-soft:#e6f4ec;
  --blue:#2f6fe0; --blue-soft:#e9f0fd; --amber:#b5791a; --amber-soft:#fbf1dc;
  --red:#d1493f; --red-soft:#fbeae8; --purple:#6d49c4; --purple-soft:#efeafb;
  --teal:#0f9d8f; --teal-soft:#e4f5f2;
  --grad:linear-gradient(115deg,#12925a 0%,#0f9d8f 100%);
  --radius:16px; --card-sh:0 1px 2px rgba(22,26,25,.05),0 1px 1px rgba(22,26,25,.03);
  --f:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
i{font-style:normal}
button{font-family:var(--f);cursor:pointer}
.over{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700}

.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 12px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:12px 12px 6px;font-weight:700}
.item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:500;border:none;background:none;text-align:left;width:100%;transition:all .15s}
.item i{font-size:19px;color:var(--faint);transition:color .15s}
.item .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--line);color:var(--muted);padding:1px 7px;border-radius:999px}
.item:hover{background:#f5f6f5;color:var(--ink)}
.item.on{background:var(--green-soft);color:var(--green-d);font-weight:600}
.item.on i{color:var(--green)}
.item.on .badge{background:#fff;color:var(--green-d)}
.foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 4px;border-top:1px solid var(--line)}
.ava{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.foot .nm{font-size:13px;font-weight:600}.foot .pl{font-size:11px;color:var(--faint)}

.wrap{display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;gap:14px;padding:0 32px}
.tsearch{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.tsearch input{border:none;background:none;outline:none;font-family:var(--f);font-size:13.5px;width:100%;color:var(--ink)}
.tsearch i{color:var(--faint);font-size:17px}
.ticon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative;border:1px solid var(--line);background:var(--surface)}
.ticon i{font-size:19px}.ticon:hover{color:var(--ink);border-color:var(--line-2)}
.tdot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.tuser{display:flex;align-items:center;gap:9px;padding-left:6px}
.main{padding:26px 32px 60px;max-width:1140px}
.fade{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}
.h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;font-size:13.5px;font-weight:600;padding:10px 16px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:all .15s}
.btn:hover{border-color:#cfd3cf;background:#fafbfa}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 8px rgba(18,146,90,.25)}
.btn.pri:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.act{border-color:var(--green);color:var(--green-d);background:var(--green-soft)}

.hero{background:var(--grad);border-radius:var(--radius);padding:22px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:8px}
.hero h3{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.hero p{font-size:13.5px;opacity:.9}
.hero .cta{background:#fff;color:var(--green-d);border:none;padding:12px 20px;border-radius:10px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;position:relative;z-index:1;white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--card-sh)}
.stat .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:14px}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.stat .tr{font-size:12px;font-weight:600;margin-top:8px;display:inline-flex;align-items:center;gap:4px}

.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--card-sh)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px}
.ch .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
.ch .t .di{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.link{color:var(--green-d);font-size:12.5px;font-weight:600;background:none;border:none}
.cb{padding:2px 20px 18px}

.appi{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
.appi:first-child{border-top:none}
.flag{font-size:22px;width:28px;text-align:center}
.appi .u{font-size:14px;font-weight:600}.appi .c{font-size:12.5px;color:var(--muted);margin-top:1px}
.appi .right{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.tag.g{background:var(--green-soft);color:var(--green-d)}.tag.b{background:var(--blue-soft);color:var(--blue)}.tag.a{background:var(--amber-soft);color:var(--amber)}.tag.n{background:var(--line);color:var(--muted)}
.mini{width:78px;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.mini span{display:block;height:100%;border-radius:999px;background:var(--green)}

.act{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:none}
.act .ai{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.act .t2{font-size:13.5px;font-weight:600}.act .d2{font-size:12.5px;color:var(--muted);margin-top:1px}
.act .tm{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}

.jr{display:flex;align-items:center;gap:13px;padding:11px 0}
.jr .jn{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.jr .jl{font-size:13.5px;font-weight:500;flex:1}
.jbar{width:120px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.jbar span{display:block;height:100%;border-radius:999px}

.meet{overflow:hidden}
.meet .hd{background:var(--grad);padding:18px 20px;color:#fff}
.meet .hd .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.meet .hd .dt{font-size:19px;font-weight:700;margin-top:4px}.meet .hd .tm{font-size:13px;opacity:.9;margin-top:2px}
.meet .bd{padding:16px 20px}
.person{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.person .pv{width:38px;height:38px;border-radius:50%;background:var(--green-soft);color:var(--green-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

.doc{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.doc i{font-size:17px}.doc .dn{flex:1}
.pbar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.pbar span{display:block;height:100%;border-radius:999px;background:var(--green)}

.dl{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.dl:first-child{border-top:none}
.dl .dd{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dl .dt2{font-size:13px;font-weight:500;flex:1}.dl .dy{font-size:12px;color:var(--muted);font-weight:600}

.search2{display:flex;align-items:center;gap:9px;border:1px solid var(--line-2);border-radius:11px;padding:10px 15px;background:var(--surface);margin:0 0 8px;max-width:420px}
.search2 input{border:none;outline:none;font-family:var(--f);font-size:14px;width:100%;background:none}
.search2 i{color:var(--faint);font-size:18px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .u{font-size:14px;font-weight:600}.row .c{font-size:12.5px;color:var(--muted);margin-top:1px}
.row .right{margin-left:auto;display:flex;align-items:center;gap:9px}
.frow{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:8px}.frow b{color:var(--ink);font-weight:700}
.slide{width:100%;accent-color:var(--green);margin-bottom:20px}
.emi{background:var(--green-soft);border-radius:14px;padding:22px;text-align:center}
.emi .big{font-size:30px;font-weight:800;color:var(--green-d);margin:6px 0 14px;letter-spacing:-.02em}
.emi .ln{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid rgba(13,117,72,.12)}

.efab{position:fixed;right:26px;bottom:26px;width:56px;height:56px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;border:none;box-shadow:0 8px 24px rgba(18,146,90,.4);z-index:30}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60}
.tst{background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;box-shadow:0 8px 24px rgba(22,26,25,.22)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">E</div><b>Eleevate</b></div>
    <nav class="nav">
      <div class="lbl">Main</div>
      <button class="item on" data-v="dashboard" onclick="show('dashboard')"><i class="ti ti-layout-dashboard"></i> Dashboard</button>
      <button class="item" data-v="universities" onclick="show('universities')"><i class="ti ti-school"></i> Universities <span class="badge">450+</span></button>
      <button class="item" data-v="applications" onclick="show('applications')"><i class="ti ti-files"></i> Applications <span class="badge">3</span></button>
      <button class="item" onclick="toast('Scholarships — 4 matches')"><i class="ti ti-award"></i> Scholarships</button>
    </nav>
    <nav class="nav">
      <div class="lbl">Visa &amp; finance</div>
      <button class="item" onclick="toast('Visa tracker — 82% complete')"><i class="ti ti-plane-departure"></i> Visa</button>
      <button class="item" onclick="toast('Documents — 8 of 11 verified')"><i class="ti ti-folder"></i> Documents</button>
      <button class="item" data-v="finance" onclick="show('finance')"><i class="ti ti-wallet"></i> Finance</button>
    </nav>
    <nav class="nav">
      <div class="lbl">You</div>
      <button class="item" onclick="toast('Opening your profile…')"><i class="ti ti-user"></i> Profile</button>
      <button class="item" onclick="toast('Career &amp; jobs')"><i class="ti ti-briefcase"></i> Career</button>
    </nav>
    <div class="foot"><div class="ava">AS</div><div><div class="nm">Arjun Sharma</div><div class="pl">Free plan</div></div></div>
  </aside>
  <div class="wrap">
    <header class="top">
      <div class="tsearch"><i class="ti ti-search"></i><input placeholder="Search universities, programmes, tasks…" onkeydown="if(event.key==='Enter'){show('universities')}"></div>
      <div class="ticon" onclick="toast('3 new notifications')"><i class="ti ti-bell"></i><span class="tdot"></span></div>
      <div class="ticon" onclick="toast('Help &amp; support')"><i class="ti ti-help"></i></div>
      <div class="tuser"><div class="ava" style="width:34px;height:34px">AS</div></div>
    </header>
    <main class="main" id="view"></main>
  </div>
</div>
<button class="efab" onclick="toast('Elee is here — ask me anything')" aria-label="Elee"><i class="ti ti-sparkles"></i></button>
<div id="toast"></div>
<script>
const UNIS=[
 {id:0,flag:'🇬🇧',name:'University of Manchester',prog:'MSc Computer Science',fees:'£21,000/yr',match:94},
 {id:1,flag:'🇬🇧',name:'University College London',prog:'MSc Artificial Intelligence',fees:'£28,500/yr',match:88},
 {id:2,flag:'🇬🇧',name:'University of Edinburgh',prog:'MSc Data Science',fees:'£19,800/yr',match:91},
 {id:3,flag:'🇨🇦',name:'University of Toronto',prog:'MCS Computer Science',fees:'CA$28,000/yr',match:85},
 {id:4,flag:'🇦🇺',name:'University of Melbourne',prog:'Master of CS',fees:'AU$42,000/yr',match:89},
 {id:5,flag:'🇺🇸',name:'Carnegie Mellon University',prog:'MSCS',fees:'US$58,000/yr',match:72},
];
const applied=new Set([0,1,3]), shortl=new Set([2]);
const appMeta={0:['Offer received','g',100],1:['Under review','b',70],3:['Applying','a',40]};
let uSearch='';
function toast(m){const w=document.getElementById('toast');const t=document.createElement('div');t.className='tst';t.textContent=m;w.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),250)},2200);}
function show(v){document.querySelectorAll('.item').forEach(i=>i.classList.toggle('on',i.dataset.v===v));const el=document.getElementById('view');el.innerHTML=({dashboard:vDashboard,universities:vUniversities,applications:vApplications,finance:vFinance}[v])();el.classList.remove('fade');void el.offsetWidth;el.classList.add('fade');if(v==='finance')computeEMI();}
function applyU(id){applied.add(id);shortl.delete(id);if(!appMeta[id])appMeta[id]=['Applying','a',35];uList();toast('Application started · '+UNIS[id].name);}
function shortU(id){if(shortl.has(id))shortl.delete(id);else shortl.add(id);uList();toast(shortl.has(id)?'Saved · '+UNIS[id].name:'Removed');}
function uList(){const l=document.getElementById('ulist');if(!l)return;const q=uSearch.trim().toLowerCase();const list=UNIS.filter(u=>!q||u.name.toLowerCase().includes(q)||u.prog.toLowerCase().includes(q));
 l.innerHTML=list.length?list.map(u=>{const ap=applied.has(u.id),sh=shortl.has(u.id);return `<div class="row"><div class="flag">${u.flag}</div><div><div class="u">${u.name}</div><div class="c">${u.prog} · ${u.fees} · ${u.match}% match</div></div><div class="right">${ap?`<span class="tag g">Applied</span>`:`<button class="btn pri sm" onclick="applyU(${u.id})">Apply</button>`}<button class="btn sm ${sh?'act':''}" onclick="shortU(${u.id})">${sh?'Saved':'Save'}</button></div></div>`;}).join(''):`<div style="padding:26px 0;color:var(--faint)">No matches.</div>`;const c=document.getElementById('ucount');if(c)c.textContent=list.length;}

function stat(ic,tint,col,l,v,tr,trc){return `<div class="stat"><div class="ic" style="background:${tint};color:${col}"><i class="ti ${ic}"></i></div><div class="l">${l}</div><div class="v">${v}</div><div class="tr" style="color:${trc}">${tr}</div></div>`;}
function jstep(ic,col,tint,l,pct,bar){return `<div class="jr"><div class="jn" style="background:${tint};color:${col}"><i class="ti ${ic}" style="font-size:14px"></i></div><div class="jl">${l}</div><div class="jbar"><span style="width:${pct}%;background:${bar}"></span></div></div>`;}

function vDashboard(){return `
 <div class="phead"><div><div class="over">Tuesday, 1 July</div><h1 class="h1">Welcome back, Arjun</h1><div class="sub">Here's everything happening across your study-abroad journey today.</div></div>
   <button class="btn pri" onclick="show('universities')"><i class="ti ti-school" style="font-size:16px"></i> Explore universities</button></div>

 <div class="hero"><div><div class="k">Next step · due in 3 days</div><h3>Pay your UK health surcharge</h3><p>£776 · the last blocker before your visa can be submitted</p></div>
   <button class="cta" onclick="toast('Opening secure payment for £776…')">Pay now <i class="ti ti-arrow-right"></i></button></div>

 <div class="stats">
   ${stat('ti-files','var(--green-soft)','var(--green)','Applications',applied.size,'<i class="ti ti-arrow-up-right"></i> 1 this week','var(--green)')}
   ${stat('ti-plane-departure','var(--blue-soft)','var(--blue)','Visa progress','82%','<i class="ti ti-arrow-up-right"></i> 12% this week','var(--green)')}
   ${stat('ti-folder','var(--amber-soft)','var(--amber)','Documents','8/11','3 pending upload','var(--amber)')}
   ${stat('ti-award','var(--purple-soft)','var(--purple)','Scholarships','₹36L','4 matches found','var(--muted)')}
 </div>

 <div class="grid">
  <div class="col">
    <div class="card">
      <div class="ch"><div class="t"><span class="di" style="background:var(--green-soft);color:var(--green)"><i class="ti ti-files" style="font-size:16px"></i></span> My applications</div><button class="link" onclick="show('applications')">View all</button></div>
      <div class="cb">${[...applied].map(id=>{const u=UNIS[id];const[st,c,p]=appMeta[id]||['Applying','a',35];return `<div class="appi"><div class="flag">${u.flag}</div><div><div class="u">${u.name}</div><div class="c">${u.prog} · ${u.fees}</div></div><div class="right"><span class="tag ${c}">${st}</span><div class="mini"><span style="width:${p}%"></span></div></div></div>`;}).join('')}</div>
    </div>
    <div class="card">
      <div class="ch"><div class="t"><span class="di" style="background:var(--teal-soft);color:var(--teal)"><i class="ti ti-sparkles" style="font-size:16px"></i></span> Elee's activity today</div><span class="tag g">3 done</span></div>
      <div class="cb">
        <div class="act"><div class="ai" style="background:var(--green-soft);color:var(--green)"><i class="ti ti-check"></i></div><div><div class="t2">Application submitted</div><div class="d2">Sent your MSc CS application to Manchester</div></div><div class="tm">2h ago</div></div>
        <div class="act"><div class="ai" style="background:var(--blue-soft);color:var(--blue)"><i class="ti ti-cash"></i></div><div><div class="t2">Loan pre-approval</div><div class="d2">Initiated HDFC Credila pre-approval for ₹40L</div></div><div class="tm">5h ago</div></div>
        <div class="act"><div class="ai" style="background:var(--amber-soft);color:var(--amber)"><i class="ti ti-file-search"></i></div><div><div class="t2">Document check</div><div class="d2">Found 3 documents still missing for your visa</div></div><div class="tm">Yesterday</div></div>
        <div class="act"><div class="ai" style="background:var(--purple-soft);color:var(--purple)"><i class="ti ti-award"></i></div><div><div class="t2">Scholarship match</div><div class="d2">Chevening — worth £18,000, deadline November</div></div><div class="tm">Yesterday</div></div>
      </div>
    </div>
    <div class="card">
      <div class="ch"><div class="t"><span class="di" style="background:var(--green-soft);color:var(--green)"><i class="ti ti-route" style="font-size:16px"></i></span> Study-abroad journey</div><span class="over" style="color:var(--muted)">62% complete</span></div>
      <div class="cb">
        ${jstep('ti-check','#fff','var(--green)','Profile &amp; assessment',100,'var(--green)')}
        ${jstep('ti-check','#fff','var(--green)','University shortlist',100,'var(--green)')}
        ${jstep('ti-dots','var(--amber)','var(--amber-soft)','Applications submitted',66,'var(--amber)')}
        ${jstep('ti-dots','var(--blue)','var(--blue-soft)','Visa application',82,'var(--blue)')}
        ${jstep('ti-dots','var(--blue)','var(--blue-soft)','Loan &amp; finance',45,'var(--blue)')}

      </div>
    </div>
  </div>
  <div class="col">
    <div class="card meet">
      <div class="hd"><div class="k">Next counsellor session</div><div class="dt">Thursday, 3 Jul</div><div class="tm">3:00 PM IST · 45 min · video call</div></div>
      <div class="bd"><div class="person"><div class="pv">PK</div><div><div style="font-weight:600;font-size:14px">Priya Kapoor</div><div style="font-size:12px;color:var(--muted)">Senior counsellor · UK specialist</div></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn pri sm" onclick="toast('Joining video call…')">Join call</button><button class="btn sm" onclick="toast('Opening reschedule…')">Reschedule</button></div></div>
    </div>
    <div class="card"><div class="ch"><div class="t"><span class="di" style="background:var(--amber-soft);color:var(--amber)"><i class="ti ti-folder" style="font-size:16px"></i></span> Documents</div><span class="tag a">3 pending</span></div>
      <div class="cb"><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:2px"><span>8 of 11 verified</span><span>72%</span></div><div class="pbar"><span style="width:72%"></span></div>
        <div class="doc"><i class="ti ti-circle-check-filled" style="color:var(--green)"></i><span class="dn">Passport &amp; IELTS</span><span style="font-size:12px;color:var(--muted)">Verified</span></div>
        <div class="doc"><i class="ti ti-circle-check-filled" style="color:var(--green)"></i><span class="dn">Degree &amp; transcripts</span><span style="font-size:12px;color:var(--muted)">Verified</span></div>
        <div class="doc"><i class="ti ti-alert-circle" style="color:var(--amber)"></i><span class="dn">Bank statement (updated)</span><span style="font-size:12px;color:var(--amber)">Pending</span></div>
        <div class="doc"><i class="ti ti-alert-circle" style="color:var(--amber)"></i><span class="dn">Health surcharge receipt</span><span style="font-size:12px;color:var(--amber)">Pending</span></div>
        <button class="btn sm" style="width:100%;justify-content:center;margin-top:12px" onclick="toast('Opening documents…')">Manage documents</button></div>
    </div>
    <div class="card"><div class="ch"><div class="t"><span class="di" style="background:var(--red-soft);color:var(--red)"><i class="ti ti-clock" style="font-size:16px"></i></span> Upcoming deadlines</div></div>
      <div class="cb"><div class="dl"><span class="dd" style="background:var(--red)"></span><span class="dt2">Health surcharge payment</span><span class="dy" style="color:var(--red)">3 days</span></div>
        <div class="dl"><span class="dd" style="background:var(--amber)"></span><span class="dt2">UCL application</span><span class="dy">11 days</span></div>
        <div class="dl"><span class="dd" style="background:var(--blue)"></span><span class="dt2">UK visa application</span><span class="dy">45 days</span></div>
        <div class="dl"><span class="dd" style="background:var(--faint)"></span><span class="dt2">Chevening scholarship</span><span class="dy">62 days</span></div></div>

  </div>
 </div>`;}

function vUniversities(){setTimeout(uList,0);return `
 <div class="phead"><div><div class="over">Discover</div><h1 class="h1">Universities</h1><div class="sub"><span id="ucount">${UNIS.length}</span> programmes matched to your profile</div></div>
  <button class="btn pri" onclick="toast('Elee is shortlisting your top matches…')"><i class="ti ti-sparkles" style="font-size:16px"></i> Let Elee shortlist</button></div>
 <div class="search2"><i class="ti ti-search"></i><input placeholder="Search a university or programme" oninput="uSearch=this.value;uList()"></div>
 <div class="card"><div class="cb" style="padding-top:6px"><div id="ulist"></div></div></div>`;}

function vApplications(){return `
 <div class="phead"><div><div class="over">Track</div><h1 class="h1">Applications</h1><div class="sub">${applied.size} live · ${shortl.size} saved</div></div></div>
 <div class="card"><div class="cb" style="padding-top:6px">${[...applied].map(id=>{const u=UNIS[id];const[st,c,p]=appMeta[id]||['Applying','a',35];return `<div class="appi"><div class="flag">${u.flag}</div><div><div class="u">${u.name}</div><div class="c">${u.prog} · ${u.fees}</div></div><div class="right"><span class="tag ${c}">${st}</span><div class="mini"><span style="width:${p}%"></span></div></div></div>`;}).join('')}</div></div>
 ${shortl.size?`<div class="over" style="margin:22px 0 8px">Saved</div><div class="card"><div class="cb" style="padding-top:6px">${[...shortl].map(id=>{const u=UNIS[id];return `<div class="appi"><div class="flag">${u.flag}</div><div><div class="u">${u.name}</div><div class="c">${u.prog}</div></div><div class="right"><button class="btn pri sm" onclick="applyU(${id});show('applications')">Apply now</button></div></div>`;}).join('')}</div></div>`:''}`;}

function vFinance(){return `
 <div class="phead"><div><div class="over">Plan</div><h1 class="h1">Finance</h1><div class="sub">Estimate your education-loan repayment</div></div></div>
 <div class="grid" style="grid-template-columns:1.5fr 1fr">
  <div class="card"><div class="cb" style="padding:22px">
    <div class="frow"><span>Loan amount</span><b id="emiA">₹20,00,000</b></div><input class="slide" id="ea" type="range" min="100000" max="10000000" step="100000" value="2000000" oninput="computeEMI()">
    <div class="frow"><span>Tenure</span><b id="emiT">120 months</b></div><input class="slide" id="et" type="range" min="12" max="180" step="6" value="120" oninput="computeEMI()">
    <div class="frow"><span>Interest rate</span><b id="emiR">10.5%</b></div><input class="slide" id="er" type="range" min="7" max="15" step="0.25" value="10.5" oninput="computeEMI()">
  </div></div>
  <div class="emi"><div class="over" style="color:var(--green-d)">Monthly EMI</div><div class="big" id="emiOut">₹26,987</div>
    <div class="ln"><span style="color:var(--muted)">Total interest</span><b id="emiI">₹12.4L</b></div>
    <div class="ln"><span style="color:var(--muted)">Total payable</span><b id="emiTp">₹32.4L</b></div></div>
 </div>`;}
function computeEMI(){const P=+(document.getElementById('ea')||{}).value||2000000,n=+(document.getElementById('et')||{}).value||120,rt=+(document.getElementById('er')||{}).value||10.5;const r=rt/1200,e=r>0?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n,tot=e*n;const S=(id,v)=>{const x=document.getElementById(id);if(x)x.textContent=v};S('emiA','₹'+Math.round(P).toLocaleString('en-IN'));S('emiT',n+' months');S('emiR',rt+'%');S('emiOut','₹'+Math.round(e).toLocaleString('en-IN'));S('emiI','₹'+Math.round(tot-P).toLocaleString('en-IN'));S('emiTp','₹'+Math.round(tot).toLocaleString('en-IN'));}
show('dashboard');
</script>
</body>
</html>
