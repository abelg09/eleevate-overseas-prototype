name: Deploy Eleevate Prototype

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build prototype
        run: pnpm --filter @workspace/eleevate run build
        env:
          BASE_PATH: /eleevate-overseas-prototype/
          VITE_DEMO_MODE: "true"

      - name: Build archived AI super-app version
        shell: bash
        run: |
          git fetch --depth=1 origin archive/ai-superapp-2026-06-04
          git worktree add ../ai-superapp-worktree FETCH_HEAD

          pushd ../ai-superapp-worktree
          pnpm install --frozen-lockfile
          BASE_PATH=/eleevate-overseas-prototype/ai-superapp/ VITE_DEMO_MODE="true" pnpm --filter @workspace/eleevate run build
          popd

          current_dist="$GITHUB_WORKSPACE/artifacts/eleevate/dist/public"
          archive_dist="$GITHUB_WORKSPACE/../ai-superapp-worktree/artifacts/eleevate/dist/public"
          mkdir -p "$current_dist/ai-superapp"
          cp -a "$archive_dist/." "$current_dist/ai-superapp/"

          ai_routes=(
            product
            login sign-in sign-up onboarding
            dashboard more journey-map
            elee-report elle-report edge-report
            profile assessment
            countries universities course-finder shortlist applications
            documents sop-studio visa-center
            language-hub test-prep mock-test upskilling e-learning
            careers job-board alumni news rewards support
            financial-hub loans remittance forex-card forex insurance tuition-payment
            marketplace services scholarships subscription
            consultant/dashboard consultant/profile consultant/crm consultant/counselling
            consultant/chatbot consultant/sop consultant/doc-review consultant/team
            consultant/partners consultant/branding consultant/lms consultant/invoicing
          )

          for route in "${ai_routes[@]}"; do
            mkdir -p "$current_dist/ai-superapp/$route"
            cp "$archive_dist/index.html" "$current_dist/ai-superapp/$route/index.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/eleevate/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
